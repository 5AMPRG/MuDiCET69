<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido Virtual | Museo Digital CETIS 69</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#escena{position:fixed;inset:0;width:100%;height:100dvh}
#escena canvas{display:block;width:100%;height:100%}
.pantalla{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1.5rem;text-align:center;background:rgba(11,15,20,.88);backdrop-filter:blur(6px);z-index:10}
.pantalla h1{font-size:clamp(1.4rem,4vw,2.2rem)}
.pantalla p{max-width:34rem;line-height:1.5;color:#c8d1dc;font-size:clamp(.9rem,2.4vw,1.05rem)}
.oculto{display:none!important}
button{background:#1f8f5f;color:#fff;border:0;border-radius:.7rem;padding:.85rem 1.8rem;font-size:1.05rem;font-weight:600;cursor:pointer}
button:hover{background:#26a870}
#barra{width:min(22rem,80vw);height:.5rem;background:#26303c;border-radius:1rem;overflow:hidden}
#progreso{width:0;height:100%;background:#1f8f5f;transition:width .2s}
#volver{position:fixed;top:max(.8rem,env(safe-area-inset-top));left:max(.8rem,env(safe-area-inset-left));z-index:20;color:#fff;text-decoration:none;background:rgba(11,15,20,.65);padding:.5rem .9rem;border-radius:.6rem;font-size:.9rem}
#mira{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);z-index:5;pointer-events:none}
#joystick{position:fixed;left:max(1.5rem,env(safe-area-inset-left));bottom:max(1.5rem,env(safe-area-inset-bottom));width:8rem;height:8rem;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);z-index:15;display:none}
#perilla{position:absolute;top:50%;left:50%;width:3.2rem;height:3.2rem;margin:-1.6rem 0 0 -1.6rem;border-radius:50%;background:rgba(255,255,255,.5)}
.tactil #joystick{display:block}
.tactil #mira{display:none}
.teclas{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;color:#c8d1dc;font-size:.9rem}
.tactil .teclas{display:none}
kbd{background:#26303c;border-radius:.35rem;padding:.15rem .5rem;border:1px solid #3a4756}
</style>
</head>
<body>
<div id="escena"></div>
<a id="volver" href="museo-cetis69.html">&larr; Volver al museo</a>
<div id="mira"></div>
<div id="joystick"><div id="perilla"></div></div>

<div id="carga" class="pantalla">
  <h1>Cargando el museo…</h1>
  <div id="barra"><div id="progreso"></div></div>
  <p id="estado">Preparando el recorrido</p>
</div>

<div id="inicio" class="pantalla oculto">
  <h1>Recorrido Virtual</h1>
  <p>Explora el Museo Digital CETIS 69 en primera persona.</p>
  <div class="teclas">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o flechas para caminar</span>
    <span><kbd>Mouse</kbd> para mirar</span>
    <span><kbd>Shift</kbd> para correr</span>
    <span><kbd>Esc</kbd> para pausar</span>
  </div>
  <p class="solo-tactil">Usa el joystick para caminar y arrastra con el otro dedo para mirar.</p>
  <button id="entrar">Entrar al museo</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const CONFIG = {
  modelo: "museo.glb",
  alturaOjos: 4.5,
  velocidad: 14,
  multiplicadorCarrera: 2,
  radioColision: 1.4,
  inicio: { x: 1.6, y: 4.7, z: 11.3 },
  mirarHacia: { x: 1.6, z: 0 },
  sensibilidadMouse: 0.0022,
  sensibilidadTactil: 0.005
};

const contenedor = document.getElementById("escena");
const pantallaCarga = document.getElementById("carga");
const pantallaInicio = document.getElementById("inicio");
const barra = document.getElementById("progreso");
const estado = document.getElementById("estado");
const botonEntrar = document.getElementById("entrar");
const joystick = document.getElementById("joystick");
const perilla = document.getElementById("perilla");

const esTactil = window.matchMedia("(pointer: coarse)").matches;
if (esTactil) {
  document.body.classList.add("tactil");
} else {
  document.querySelector(".solo-tactil").classList.add("oculto");
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
contenedor.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x0b0f14);

const camara = new THREE.PerspectiveCamera(70, 1, 0.1, 2000);
camara.rotation.order = "YXZ";
camara.position.set(CONFIG.inicio.x, CONFIG.inicio.y, CONFIG.inicio.z);

escena.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 1.2);
sol.position.set(30, 80, 40);
escena.add(sol);

let yaw = Math.atan2(-(CONFIG.mirarHacia.x - CONFIG.inicio.x), -(CONFIG.mirarHacia.z - CONFIG.inicio.z));
let pitch = 0;
const mallas = [];
const teclas = new Set();
const joy = { x: 0, y: 0 };
let activo = false;
let listo = false;

function ajustarTamano() {
  const ancho = contenedor.clientWidth;
  const alto = contenedor.clientHeight;
  renderer.setSize(ancho, alto);
  camara.aspect = ancho / alto;
  camara.updateProjectionMatrix();
}
window.addEventListener("resize", ajustarTamano);
ajustarTamano();

new GLTFLoader().load(
  CONFIG.modelo,
  (gltf) => {
    escena.add(gltf.scene);
    gltf.scene.traverse((obj) => {
      if (obj.isMesh) {
        mallas.push(obj);
        if (obj.material && obj.material.map) obj.material.map.anisotropy = 8;
      }
    });
    gltf.scene.updateMatrixWorld(true);
    listo = true;
    pantallaCarga.classList.add("oculto");
    pantallaInicio.classList.remove("oculto");
  },
  (evento) => {
    if (evento.lengthComputable) {
      const porcentaje = Math.round((evento.loaded / evento.total) * 100);
      barra.style.width = porcentaje + "%";
      estado.textContent = porcentaje + "%";
    }
  },
  () => {
    pantallaCarga.querySelector("h1").textContent = "No se pudo cargar el modelo";
    estado.textContent = "Verifica que " + CONFIG.modelo + " esté en la misma carpeta que esta página.";
    barra.parentElement.classList.add("oculto");
  }
);

const rayo = new THREE.Raycaster();
const abajo = new THREE.Vector3(0, -1, 0);
const origen = new THREE.Vector3();
const direccion = new THREE.Vector3();

function chocaEn(x, y, z, dx, dz, distancia) {
  origen.set(x, y, z);
  direccion.set(dx, 0, dz).normalize();
  rayo.set(origen, direccion);
  rayo.far = distancia;
  return rayo.intersectObjects(mallas, false).length > 0;
}

function alturaSuelo(x, y, z) {
  origen.set(x, y, z);
  rayo.set(origen, abajo);
  rayo.far = CONFIG.alturaOjos * 3;
  const impactos = rayo.intersectObjects(mallas, false);
  return impactos.length ? impactos[0].point.y : null;
}

function mover(dt) {
  let avance = 0;
  let lateral = 0;
  if (teclas.has("KeyW") || teclas.has("ArrowUp")) avance += 1;
  if (teclas.has("KeyS") || teclas.has("ArrowDown")) avance -= 1;
  if (teclas.has("KeyD") || teclas.has("ArrowRight")) lateral += 1;
  if (teclas.has("KeyA") || teclas.has("ArrowLeft")) lateral -= 1;
  avance += -joy.y;
  lateral += joy.x;

  const magnitud = Math.hypot(avance, lateral);
  if (magnitud > 1) {
    avance /= magnitud;
    lateral /= magnitud;
  }

  const correr = teclas.has("ShiftLeft") || teclas.has("ShiftRight") ? CONFIG.multiplicadorCarrera : 1;
  const paso = CONFIG.velocidad * correr * dt;
  const seno = Math.sin(yaw);
  const coseno = Math.cos(yaw);
  let dx = (-seno * avance + coseno * lateral) * paso;
  let dz = (-coseno * avance - seno * lateral) * paso;

  const p = camara.position;
  const yPies = p.y - CONFIG.alturaOjos * 0.45;

  if (dx !== 0 && chocaEn(p.x, yPies, p.z, Math.sign(dx), 0, CONFIG.radioColision + Math.abs(dx))) dx = 0;
  if (dz !== 0 && chocaEn(p.x, yPies, p.z, 0, Math.sign(dz), CONFIG.radioColision + Math.abs(dz))) dz = 0;

  p.x += dx;
  p.z += dz;

  const suelo = alturaSuelo(p.x, p.y, p.z);
  if (suelo !== null) {
    const objetivo = suelo + CONFIG.alturaOjos;
    p.y += (objetivo - p.y) * Math.min(1, dt * 12);
  }
}

let anterior = performance.now();
function animar(ahora) {
  const dt = Math.min((ahora - anterior) / 1000, 0.05);
  anterior = ahora;
  if (activo && listo) mover(dt);
  camara.rotation.set(pitch, yaw, 0);
  renderer.render(escena, camara);
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

function girar(dx, dy, sensibilidad) {
  yaw -= dx * sensibilidad;
  pitch -= dy * sensibilidad;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
}

botonEntrar.addEventListener("click", () => {
  pantallaInicio.classList.add("oculto");
  activo = true;
  if (!esTactil) renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  if (esTactil) return;
  if (document.pointerLockElement === renderer.domElement) {
    activo = true;
    pantallaInicio.classList.add("oculto");
  } else {
    activo = false;
    teclas.clear();
    if (listo) {
      botonEntrar.textContent = "Continuar";
      pantallaInicio.classList.remove("oculto");
    }
  }
});

document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement === renderer.domElement) girar(e.movementX, e.movementY, CONFIG.sensibilidadMouse);
});

window.addEventListener("keydown", (e) => {
  if (activo) teclas.add(e.code);
});
window.addEventListener("keyup", (e) => teclas.delete(e.code));
window.addEventListener("blur", () => teclas.clear());

let idJoystick = null;
let idMirada = null;
let ultimoToque = null;
const radioJoystick = () => joystick.clientWidth / 2;

function actualizarJoystick(toque) {
  const caja = joystick.getBoundingClientRect();
  const cx = caja.left + caja.width / 2;
  const cy = caja.top + caja.height / 2;
  let dx = toque.clientX - cx;
  let dy = toque.clientY - cy;
  const maximo = radioJoystick();
  const distancia = Math.hypot(dx, dy);
  if (distancia > maximo) {
    dx = (dx / distancia) * maximo;
    dy = (dy / distancia) * maximo;
  }
  perilla.style.transform = "translate(" + dx + "px," + dy + "px)";
  joy.x = dx / maximo;
  joy.y = dy / maximo;
}

function soltarJoystick() {
  idJoystick = null;
  joy.x = 0;
  joy.y = 0;
  perilla.style.transform = "translate(0,0)";
}

joystick.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const toque = e.changedTouches[0];
  idJoystick = toque.identifier;
  actualizarJoystick(toque);
}, { passive: false });

window.addEventListener("touchstart", (e) => {
  if (!activo) return;
  for (const toque of e.changedTouches) {
    if (joystick.contains(toque.target)) continue;
    if (idMirada === null) {
      idMirada = toque.identifier;
      ultimoToque = { x: toque.clientX, y: toque.clientY };
    }
  }
}, { passive: false });

window.addEventListener("touchmove", (e) => {
  if (!activo) return;
  e.preventDefault();
  for (const toque of e.changedTouches) {
    if (toque.identifier === idJoystick) {
      actualizarJoystick(toque);
    } else if (toque.identifier === idMirada && ultimoToque) {
      girar(toque.clientX - ultimoToque.x, toque.clientY - ultimoToque.y, CONFIG.sensibilidadTactil);
      ultimoToque = { x: toque.clientX, y: toque.clientY };
    }
  }
}, { passive: false });

function terminarToque(e) {
  for (const toque of e.changedTouches) {
    if (toque.identifier === idJoystick) soltarJoystick();
    if (toque.identifier === idMirada) {
      idMirada = null;
      ultimoToque = null;
    }
  }
}
window.addEventListener("touchend", terminarToque);
window.addEventListener("touchcancel", terminarToque);
</script>
</body>
</html>
